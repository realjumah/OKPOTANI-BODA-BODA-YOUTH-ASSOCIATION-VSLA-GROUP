<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSLA Group Book</title>
<style>
:root{--ink:#1b2a41;--paper:#f6f8fa;--card:#fff;--maize:#e8b100;--leaf:#2e7d5b;--red:#b3261e;--line:#d5dce4}
@media(prefers-color-scheme:dark){:root{--ink:#e6edf5;--paper:#12181f;--card:#1a222c;--line:#2d3844;--maize:#f0c030;--leaf:#4fb286;--red:#f0716a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1b2a41;color:#f6f8fa}
header h1{font-size:1.1rem;margin:0}
main{max-width:720px;margin:0 auto;padding:16px}
nav{display:flex;gap:2px;margin-bottom:16px;border-bottom:2px solid var(--line);overflow-x:auto}
nav button{flex:1;padding:10px 8px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:inherit;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{border-color:var(--maize);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
label{display:block;font-size:.9rem;margin:8px 0 2px}
input,select{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:inherit}
button.pri{margin-top:12px;width:100%;padding:12px;font:inherit;font-weight:700;background:var(--maize);color:#1b2a41;border:0;border-radius:4px;cursor:pointer}
button.sec{padding:10px;font:inherit;background:none;border:1px solid var(--line);border-radius:4px;color:inherit;cursor:pointer;width:100%;margin-top:8px}
button.lnk{background:none;border:0;color:var(--red);font:inherit;cursor:pointer;padding:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--leaf);outline-offset:1px}
.row,.mrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:center}
.mrow{background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;cursor:pointer}
.sub{font-size:.85rem;opacity:.7}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.big{font-size:1.4rem;font-weight:700}
.stat{display:flex;gap:12px;flex-wrap:wrap}.stat>div{flex:1;min-width:110px}
.r2{display:flex;gap:8px}.r2>*{flex:1}
.wide{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
#msg{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#1b2a41;color:#f6f8fa;padding:8px 14px;border-radius:4px;display:none;z-index:9}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{text-align:center;font-size:.8rem;opacity:.7}
.day{min-height:54px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:inherit;font:inherit;cursor:pointer;padding:2px}
.day.sun{border-color:var(--maize);border-style:dashed}.day.sat{border-style:dotted}
.day.held{background:var(--leaf);color:#fff;border-style:solid}.day.today{outline:2px solid var(--ink)}
.day small{display:block;font-size:.7rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.mr{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.mr .mrow{border:0;min-height:50px;flex:1}
.dots{width:50px;background:none;border:0;border-left:1px solid var(--line);color:inherit;font-size:1.3rem;cursor:pointer}
.bds{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bd{font-size:.75rem;font-weight:700;padding:1px 6px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.bd.Present{background:var(--leaf);color:#fff;border-color:var(--leaf)}.bd.Late{background:var(--maize);color:#1b2a41;border-color:var(--maize)}.bd.Absent{background:var(--red);color:#fff;border-color:var(--red)}
.brush{position:sticky;top:0;z-index:3;background:var(--card);padding:10px 0 6px;border-bottom:2px solid var(--maize)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:10px 14px;border:1px solid var(--line);border-radius:20px;background:var(--paper);color:inherit;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--maize);color:#1b2a41;border-color:var(--maize);font-weight:700}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px;border-radius:12px 12px 0 0}
</style>
</head>
<body>
<header><h1>VSLA Group Book</h1><span class="sub" id="sync" style="color:inherit"></span></header>
<main id="main"></main>
<div id="msg" role="status"></div>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,writeBatch,onSnapshot,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAa46jt-G7Ma4aH8MHxvPnLf13L2yvgFpM",
  authDomain: "vsla-app-d70dd.firebaseapp.com",
  projectId: "vsla-app-d70dd",
  storageBucket: "vsla-app-d70dd.firebasestorage.app",
  messagingSenderId: "797658721016",
  appId: "1:797658721016:web:a05a0d765d218d543da90d"
};

const S={user:null,groups:[],gid:null,members:[],meetings:[],entries:[],expenses:[],tab:"meeting",date:null,cal:new Date(),modal:false,brush:{g:"Attendance",k:"attendance",v:"Present",l:"Attendance: Present"},q:"",hide:false,pick:false};
let unsubs=[],gUn=[],watching=null;
const $=s=>document.querySelector(s),N=v=>+v||0,money=n=>Math.round(n||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=t=>{const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2600)};
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P=s=>{const[a,b,c]=s.split("-");return new Date(+a,b-1,+c)};
const AD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>P(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const G=()=>S.groups.find(g=>g.id===S.gid);
const cfg=()=>({interestRate:30,loanWeeks:4,registrationFee:0,retentionPerWeek:0,absentFine:0,lateFine:0,noiseFine:0,loanFormFee:0,openingBalance:0,savChips:"10000,20000",sfChips:"1000,2000,5000,10000",...(G()?.settings||{})});
const gcol=n=>collection(db,"groups",S.gid,n),gdoc=(n,id)=>doc(db,"groups",S.gid,n,id);
const mem=()=>[...S.members].sort((a,b)=>a.memberNo-b.memberNo);
const dates=()=>[...new Set([...S.meetings.map(m=>m.id),...S.entries.map(e=>e.date)])].sort();
const wk=d=>dates().indexOf(d)+1;
const fines=e=>N(e.absentFine)+N(e.lateFine)+N(e.noiseFine)+N(e.otherFines);
// Total Paid = cash the member hands in this week. Loan Taken is cash going out, so it is not included.
const paid=e=>N(e.registration)+N(e.retention)+N(e.savings)+N(e.socialFund)+N(e.loanRepayment)+N(e.loanFormFee)+fines(e);
const mOf=id=>S.members.find(m=>m.id===id)||{name:"Unknown",memberNo:"?"};
const sumE=(es,k)=>es.reduce((a,e)=>a+N(e[k]),0);
async function bulk(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(([r,d])=>b.set(r,d,{merge:true}));await b.commit()}}
window.addEventListener("online",()=>$("#sync").textContent="");
window.addEventListener("offline",()=>$("#sync").textContent="Offline: saving on phone");

/* ---------- AUTH ---------- */
const emailOf=p=>p.replace(/\D/g,"")+"@savingsbook.app";
function stop(){unsubs.forEach(f=>f());unsubs=[];gUn.forEach(f=>f());gUn=[];watching=null}
function login(){
  stop();
  $("#main").innerHTML=`<div class="box"><h2>Sign in</h2><label for="ph">Phone number</label><input id="ph" inputmode="tel" placeholder="0772123456"><label for="pin">6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6"><button class="pri" id="in">Sign in</button><button class="pri" id="up" style="background:var(--leaf);color:#fff">Create account</button></div>`;
  const run=async fn=>{const ph=$("#ph").value,pin=$("#pin").value;
    if(ph.replace(/\D/g,"").length<9||!/^\d{6}$/.test(pin))return toast("Enter a valid phone number and a 6-digit PIN");
    try{await fn(auth,emailOf(ph),pin)}catch(e){toast(e.code==="auth/invalid-credential"?"Wrong phone number or PIN":e.code==="auth/email-already-in-use"?"Account exists. Sign in instead":"Could not sign in: "+e.code)}};
  $("#in").onclick=()=>run(signInWithEmailAndPassword);$("#up").onclick=()=>run(createUserWithEmailAndPassword);
}
onAuthStateChanged(auth,u=>{
  S.user=u;stop();if(!u)return login();
  unsubs.push(onSnapshot(query(collection(db,"groups"),where("ownerId","==",u.uid)),snap=>{
    S.groups=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.groups.find(g=>g.id===S.gid))S.gid=S.groups[0]?.id||null;
    if(!S.gid)return createGroup();
    watch();$("#body")?refresh():shell();
  }));
});
function createGroup(){
  $("#main").innerHTML=`<div class="box"><h2>Create your group</h2><label for="gn">Group name</label><input id="gn" placeholder="e.g. OYBA Build Up"><button class="pri" id="mk">Create group</button><button class="lnk" id="out">Sign out</button></div>`;
  $("#mk").onclick=async()=>{const name=$("#gn").value.trim();if(!name)return toast("Enter a group name");
    await addDoc(collection(db,"groups"),{name,ownerId:S.user.uid,createdAt:serverTimestamp()})};
  $("#out").onclick=()=>signOut(auth);
}
function watch(){
  if(watching===S.gid)return;gUn.forEach(f=>f());gUn=[];watching=S.gid;
  [["members","members"],["meetings","meetings"],["entries","entries"],["expenses","expenses"]].forEach(([n,k])=>gUn.push(onSnapshot(gcol(n),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(k==="members")fixIds();refresh()})));
}

// Members created by the first version have no ID number: number them once, in the order they were added.
function fixIds(){const miss=S.members.filter(m=>!m.memberNo);if(!miss.length)return;let n=S.members.reduce((a,m)=>Math.max(a,m.memberNo||0),0);
  miss.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).forEach(m=>updateDoc(gdoc("members",m.id),{memberNo:++n,status:m.status||"Active",gender:m.gender||"",village:m.village||"",contact:m.contact||m.phone||"",joinDate:m.joinDate||""}))}

/* ---------- SHELL ---------- */
const V={};
function shell(){
  const T=[["meeting","Meeting"],["calendar","Calendar"],["members","Members"],["loans","Loans"],["summary","Summary"],["tools","Tools"]];
  $("#main").innerHTML=`<div class="sub" style="margin-bottom:8px">${esc(G().name)} <button class="lnk" id="out" style="color:inherit;text-decoration:underline">Sign out</button></div><nav>${T.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("")}</nav><div id="body"></div>`;
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;shell()});
  $("#out").onclick=()=>signOut(auth);refresh(true);scrollTo(0,0);
}
function refresh(force){
  if(!S.gid||!$("#body"))return;
  const a=document.activeElement;
  if(!force&&(S.modal||S.tab==="tools"||(a&&$("#body").contains(a)&&/INPUT|SELECT/.test(a.tagName))))return;
  const y=scrollY;V[S.tab]();scrollTo(0,y);
}
const body=h=>$("#body").innerHTML=h;
const inp=(id,l,t="text",v="",x="")=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==="number"?'inputmode="numeric" min="0"':""} value="${esc(v)}" ${x}>`;

/* ---------- MEETING (weekly sheet) ---------- */
function brushes(){
  const c=cfg(),ch=s=>String(s||"").split(",").map(x=>+x.trim()).filter(x=>x>0);
  const mk=(g,k,arr)=>({g,items:arr.map(([t,v])=>({g,k,v,t,l:v==="?"?g+": other amount":g+": "+t}))});
  return [mk("Attendance","attendance",[["Present","Present"],["Late","Late"],["Absent","Absent"]]),
    mk("Savings","savings",[...ch(c.savChips).map(a=>[money(a),a]),["Other","?"]]),
    mk("Social fund","socialFund",[...ch(c.sfChips).map(a=>[money(a),a]),["Other","?"]]),
    {g:"Fines",items:[{g:"Fines",k:"noiseFine",v:N(c.noiseFine)||"?",t:"Noise fine",l:"Fine: noise"},{g:"Fines",k:"otherFines",v:"?",t:"Other fine",l:"Fine: other amount"}]}];
}
// One tap on a member applies the chosen action. Tapping again with the same action undoes it.
function apply(mid){
  const b=S.brush,id=S.date+"_"+mid,{id:_x,...e}=S.entries.find(x=>x.id===id)||{date:S.date,memberId:mid};
  let v=b.v;
  if(v==="?"){const x=prompt(b.l.replace(/:.*/,"")+" amount");if(x===null)return;v=N(x)}
  if(e[b.k]===v)v=b.k==="attendance"?"":0;
  e[b.k]=v;
  if(b.k==="attendance"){const c=cfg();e.absentFine=v==="Absent"?N(c.absentFine):0;e.lateFine=v==="Late"?N(c.lateFine):0}
  e.totalFines=fines(e);e.totalPaid=paid(e);
  setDoc(gdoc("entries",id),e).catch(x=>toast("Could not save: "+x.code));
}
V.meeting=()=>{
  const ds=dates();
  if(!ds.length)return body(`<div class="box"><h2>No meetings yet</h2><p class="sub">Open the Calendar tab and tap a Sunday or Saturday to start the first meeting.</p></div>`);
  if(!ds.includes(S.date))S.date=ds[ds.length-1];
  const d=S.date,es=S.entries.filter(e=>e.date===d),EM=Object.fromEntries(es.map(e=>[e.memberId,e])),c=x=>es.filter(e=>e.attendance===x).length,sat=P(d).getDay()===6;
  const B=brushes(),b=S.brush,act=mem().filter(m=>m.status!=="Inactive"),has=e=>e&&(b.k==="attendance"?!!e.attendance:N(e[b.k])>0);
  const done=act.filter(m=>has(EM[m.id])).length;
  const tot=b.k==="attendance"?`${c("Present")} present · ${c("Late")} late · ${c("Absent")} absent`:"total "+money(sumE(es,b.k));
  body(`<div class="box"><label for="md">Meeting</label><select id="md">${[...ds].reverse().map(x=>`<option value="${x}" ${x===d?"selected":""}>Wk ${wk(x)} · ${fmt(x)}</option>`).join("")}</select>
  <div class="r2"><button class="sec" id="mv">${sat?"Move to Sunday":"Move to Saturday"}</button><button class="sec" id="cd">Change date</button></div><button class="sec" id="allp">Mark everyone without a record as Present</button></div>
  <div class="box" style="padding-top:0"><div class="brush"><div class="r2" style="align-items:center"><div><b>${esc(b.l)}</b><div class="sub">${done} of ${act.length} done · ${tot}</div></div><button class="sec" id="chg" style="margin:0;flex:none;width:auto" aria-expanded="${S.pick}">${S.pick?"Close":"Change"}</button></div>
  ${S.pick?`<div style="margin-top:8px">${B.map((g,gi)=>`<div class="sub">${g.g}</div><div class="chips">${g.items.map((it,ii)=>`<button class="chip" data-b="${gi}:${ii}" aria-pressed="${b.k===it.k&&b.v===it.v}">${esc(it.t)}</button>`).join("")}</div>`).join("")}<p class="sub">Late and absent fines are added automatically from the amounts in Tools &gt; Group settings.</p></div>`:""}
  <div class="r2" style="margin-top:8px"><input id="q" placeholder="Search name or ID" aria-label="Search member" value="${esc(S.q)}"><button class="sec" id="hid" aria-pressed="${S.hide}" style="margin:0">${S.hide?"Show all":"Hide done"}</button></div></div>
  <p class="sub">Choose an action above, then tap each member's name to apply it. Tap again to undo. Use ⋯ for loans, fees and other details.</p><div id="ml"></div></div>
  ${summaryBox(d,es,c)}`);
  const att={Present:"P",Late:"L",Absent:"A"};
  const paint=()=>{const q=S.q.toLowerCase();
    $("#ml").innerHTML=act.filter(m=>(!q||m.name.toLowerCase().includes(q)||String(m.memberNo)===q)&&!(S.hide&&has(EM[m.id]))).map(m=>{const e=EM[m.id]||{};
      const bd=[e.attendance?`<span class="bd ${e.attendance}">${att[e.attendance]}</span>`:"",N(e.savings)?`<span class="bd">S ${money(e.savings)}</span>`:"",N(e.socialFund)?`<span class="bd">SF ${money(e.socialFund)}</span>`:"",fines(e)?`<span class="bd">Fine ${money(fines(e))}</span>`:"",N(e.loanTaken)?`<span class="bd">Loan ${money(e.loanTaken)}</span>`:""].join("");
      return `<div class="mr"><button class="mrow" data-a="${m.id}"><span>#${m.memberNo} ${esc(m.name)}</span><span class="bds">${bd}</span></button><button class="dots" data-m="${m.id}" aria-label="Details for ${esc(m.name)}">⋯</button></div>`}).join("")||`<p class="sub">${S.hide?"Everyone is done for this action.":"No members found."}</p>`;
    document.querySelectorAll("#ml [data-a]").forEach(x=>x.onclick=()=>apply(x.dataset.a));
    document.querySelectorAll("#ml [data-m]").forEach(x=>x.onclick=()=>openEntry(x.dataset.m))};
  paint();$("#q").oninput=e=>{S.q=e.target.value;paint()};
  $("#chg").onclick=()=>{S.pick=!S.pick;V.meeting()};$("#hid").onclick=()=>{S.hide=!S.hide;V.meeting()};
  document.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>{const[g,i]=x.dataset.b.split(":");S.brush=B[g].items[i];S.pick=false;V.meeting()});
  $("#md").onchange=e=>{S.date=e.target.value;V.meeting()};bindCash(d);
  $("#mv").onclick=()=>moveMeeting(d,AD(d,sat?1:-1));
  $("#cd").onclick=()=>{const n=prompt("New date (YYYY-MM-DD)",d);if(n&&/^\d{4}-\d\d-\d\d$/.test(n))moveMeeting(d,n);else if(n)toast("Use the format YYYY-MM-DD")};
  $("#allp").onclick=async()=>{const items=act.filter(m=>!EM[m.id]).map(m=>[gdoc("entries",d+"_"+m.id),{date:d,memberId:m.id,attendance:"Present",totalFines:0,totalPaid:0}]);
    if(items.length&&confirm("Mark "+items.length+" members as Present?")){await bulk(items);toast("Done")}};
};
async function moveMeeting(a,b){
  if(dates().includes(b))return toast("A meeting already exists on that date");
  const bt=writeBatch(db);
  S.entries.filter(e=>e.date===a).forEach(({id,...e})=>{bt.set(gdoc("entries",b+"_"+e.memberId),{...e,date:b});bt.delete(gdoc("entries",id))});
  S.expenses.filter(x=>x.date===a).forEach(x=>bt.update(gdoc("expenses",x.id),{date:b}));
  bt.set(gdoc("meetings",b),{date:b});bt.delete(gdoc("meetings",a));
  await bt.commit();S.date=b;toast("Meeting moved to "+fmt(b));
}
/* ---------- CASH BOOK ---------- */
function cash(d){
  const es=S.entries.filter(e=>e.date===d),ex=S.expenses.filter(x=>x.date===d);
  const r={reg:sumE(es,"registration"),ret:sumE(es,"retention"),sav:sumE(es,"savings"),sf:sumE(es,"socialFund"),fee:sumE(es,"loanFormFee"),fin:es.reduce((a,e)=>a+fines(e),0),rep:sumE(es,"loanRepayment"),loan:sumE(es,"loanTaken"),exs:ex,exp:ex.reduce((a,x)=>a+N(x.amount),0)};
  r.in=r.reg+r.ret+r.sav+r.sf+r.fee+r.fin+r.rep;r.net=r.in-r.loan-r.exp;return r;
}
function book(){let bal=N(cfg().openingBalance);return dates().map(d=>{const r=cash(d);r.d=d;r.open=bal;bal+=r.net;r.close=bal;return r})}
function summaryBox(d,es,c){
  const r=cash(d),b=book().find(x=>x.d===d),row=(l,v,s)=>`<div class="row"${s?' style="font-weight:700"':""}><span>${l}</span><span class="num">${money(v)}</span></div>`;
  return `<div class="box"><h2>Money in</h2>${row("Registration",r.reg)}${row("Retention",r.ret)}${row("Savings",r.sav)}${row("Social fund",r.sf)}${row("Loan form fees",r.fee)}${row("Fines",r.fin)}${row("Loan repayments",r.rep)}${row("Total money in",r.in,1)}</div>
  <div class="box"><h2>Money out</h2>${row("Loans given",r.loan)}${r.exs.map(x=>`<div class="row"><span>${esc(x.item)}</span><span><b class="num">${money(x.amount)}</b> <button class="lnk" data-xd="${x.id}" aria-label="Delete expense ${esc(x.item)}">Delete</button></span></div>`).join("")}${row("Total expenses",r.exp)}${row("Total money out",r.loan+r.exp,1)}
  ${inp("xi","Add expense (e.g. printing loan forms, pens, rulers)")}${inp("xa","Amount","number")}<button class="sec" id="xadd">Add expense</button></div>
  <div class="box">${row("Brought forward",b.open)}${row("Left from this meeting",r.net)}${row("Money in the box now",b.close,1)}<p class="sub">Includes the social fund (${money(r.sf)} collected this meeting). Attendance: ${c("Present")} present, ${c("Late")} late, ${c("Absent")} absent.</p><button class="sec" id="shr">Share summary</button></div>`;
}
function bindCash(d){
  $("#xadd").onclick=async()=>{const item=$("#xi").value.trim(),amount=N($("#xa").value);if(!item||!(amount>0))return toast("Enter what was bought and the amount");await addDoc(gcol("expenses"),{date:d,item,amount,createdAt:serverTimestamp()});toast("Expense added")};
  document.querySelectorAll("[data-xd]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this expense?"))await deleteDoc(gdoc("expenses",b.dataset.xd))});
  $("#shr").onclick=async()=>{const r=cash(d),b=book().find(x=>x.d===d),t=`${G().name} - Wk ${wk(d)}, ${fmt(d)}\nSavings: ${money(r.sav)}\nSocial fund: ${money(r.sf)}\nFines: ${money(r.fin)}\nLoan form fees: ${money(r.fee)}\nLoan repayments: ${money(r.rep)}\nRegistration and retention: ${money(r.reg+r.ret)}\nTotal money in: ${money(r.in)}\nLoans given: ${money(r.loan)}\nExpenses: ${money(r.exp)}${r.exs.map(x=>`\n  - ${x.item}: ${money(x.amount)}`).join("")}\nMoney in the box: ${money(b.close)}`;
    try{navigator.share?await navigator.share({text:t}):(await navigator.clipboard.writeText(t),toast("Summary copied"))}catch{}};
}
const KEYS=["registration","retention","savings","socialFund","loanTaken","loanRepayment","loanFormFee","absentFine","lateFine","noiseFine","otherFines"];
function openEntry(mid){
  const m=S.members.find(x=>x.id===mid),d=S.date,old=S.entries.find(e=>e.id===d+"_"+mid),c=cfg();
  const e=old||{retention:c.retentionPerWeek||"",loanRate:c.interestRate};
  S.modal=true;
  const f=(k,l)=>inp("f_"+k,l,"number",e[k]??"");
  const box=document.createElement("div");box.className="modal";
  box.innerHTML=`<div class="sheet" role="dialog" aria-label="Weekly record"><h2>#${m.memberNo} ${esc(m.name)}</h2><div class="sub">Wk ${wk(d)} · ${fmt(d)}</div>
  <label for="f_att">Attendance</label><select id="f_att">${["","Present","Late","Absent"].map(x=>`<option value="${x}" ${e.attendance===x?"selected":""}>${x||"Not recorded"}</option>`).join("")}</select>
  ${f("registration","Registration")}${f("retention","Retention")}${f("savings","Savings")}${f("socialFund","Social fund")}${f("loanTaken","Loan taken")}${inp("f_loanRate","Loan interest (%)","number",e.loanRate??c.interestRate)}${f("loanRepayment","Loan repayment")}${f("loanFormFee","Loan form fee")}${f("absentFine","Absent fine")}${f("lateFine","Late fine")}${f("noiseFine","Noise fine")}${f("otherFines","Other fines")}
  <div class="box" id="tot" style="margin-top:12px"></div><button class="pri" id="sv">Save</button><button class="sec" id="cl">Cancel</button>${old?`<button class="lnk" id="rm">Clear this record</button>`:""}</div>`;
  document.body.appendChild(box);
  const get=()=>{const o={attendance:$("#f_att").value,loanRate:N($("#f_loanRate").value)};KEYS.forEach(k=>o[k]=N($("#f_"+k).value));return o};
  const tot=()=>{const o=get();$("#tot").innerHTML=`Total fines <b>${money(fines(o))}</b><br>Total paid <b>${money(paid(o))}</b>`};
  box.querySelectorAll("input").forEach(i=>i.oninput=tot);tot();
  $("#f_loanTaken").addEventListener("input",()=>{if(N($("#f_loanTaken").value)>0&&!$("#f_loanFormFee").value&&c.loanFormFee){$("#f_loanFormFee").value=c.loanFormFee;tot()}});
  $("#f_att").onchange=ev=>{const a=ev.target.value;$("#f_absentFine").value=a==="Absent"&&c.absentFine?c.absentFine:"";$("#f_lateFine").value=a==="Late"&&c.lateFine?c.lateFine:"";tot()};
  const close=()=>{box.remove();S.modal=false;refresh(true)};
  $("#cl").onclick=close;
  $("#sv").onclick=async()=>{const o=get();try{await setDoc(gdoc("entries",d+"_"+mid),{...o,date:d,memberId:mid,totalFines:fines(o),totalPaid:paid(o)});close();toast("Saved")}catch(x){toast("Could not save: "+x.code)}};
  if(old)$("#rm").onclick=async()=>{if(confirm("Clear this record?")){await deleteDoc(gdoc("entries",d+"_"+mid));close()}};
}

/* ---------- CALENDAR ---------- */
V.calendar=()=>{
  const y=S.cal.getFullYear(),mo=S.cal.getMonth(),n=new Date(y,mo+1,0).getDate(),ds=dates(),td=iso(new Date()),t=new Date();
  let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<b>${x}</b>`).join("")+"<span></span>".repeat(new Date(y,mo,1).getDay());
  for(let i=1;i<=n;i++){const dt=new Date(y,mo,i),s=iso(dt),w=dt.getDay(),h=ds.includes(s);
    cells+=`<button class="day ${h?"held":""} ${w===0?"sun":w===6?"sat":""} ${s===td?"today":""}" data-d="${s}" aria-label="${fmt(s)}${h?", meeting week "+wk(s):""}">${i}${h?`<small>Wk ${wk(s)}</small>`:""}</button>`}
  const nx=new Date(t);nx.setDate(t.getDate()+(7-t.getDay())%7);const ns=iso(nx);nx.setDate(nx.getDate()-1);const nsat=iso(nx);
  body(`<div class="box"><div class="r2" style="align-items:center"><button class="sec" id="pv" aria-label="Previous month">‹</button><h2 style="text-align:center;margin:0">${S.cal.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h2><button class="sec" id="nx" aria-label="Next month">›</button></div><div class="cal" style="margin-top:10px">${cells}</div>
  <p class="sub">Green = meeting held. Dashed gold = Sunday, dotted = Saturday. Tap any date to open or start a meeting.</p></div>
  <div class="box"><h2>Next meeting</h2>${ds.includes(ns)?"":`<button class="sec" data-s="${ns}">Start meeting: ${fmt(ns)}</button>`}${ds.includes(nsat)?"":`<button class="sec" data-s="${nsat}">Start meeting: ${fmt(nsat)} (Saturday)</button>`}</div>`);
  $("#pv").onclick=()=>{S.cal=new Date(y,mo-1,1);V.calendar()};$("#nx").onclick=()=>{S.cal=new Date(y,mo+1,1);V.calendar()};
  const open=async s=>{if(!dates().includes(s)){if(!confirm("Start a meeting on "+fmt(s)+"?"))return;await setDoc(gdoc("meetings",s),{date:s})}S.date=s;S.tab="meeting";shell()};
  document.querySelectorAll("[data-d],[data-s]").forEach(b=>b.onclick=()=>open(b.dataset.d||b.dataset.s));
};
S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth(),1);

/* ---------- MEMBERS ---------- */
V.members=()=>{
  const ms=mem(),next=ms.reduce((a,m)=>Math.max(a,m.memberNo),0)+1;
  body(`<div class="box"><h2>Add member (ID ${next})</h2>${inp("mn","Full name")}<label for="mg">Gender</label><select id="mg"><option>M</option><option>F</option></select>${inp("mvl","Village")}${inp("mc","Contact","tel")}${inp("mj","Join date","date",iso(new Date()))}<button class="pri" id="go">Add member</button></div>
  <div class="box"><h2>Members (${ms.length})</h2>${ms.map(m=>`<div class="row"><div>#${m.memberNo} ${esc(m.name)}<div class="sub">${esc(m.gender||"")} · ${esc(m.village||"")} · ${esc(m.contact||"")} · joined ${esc(m.joinDate||"")}</div></div><div><button class="lnk" style="color:${m.status==="Inactive"?"var(--red)":"var(--leaf)"}" data-st="${m.id}">${m.status||"Active"}</button><button class="lnk" data-del="${m.id}" aria-label="Delete ${esc(m.name)}">Delete</button></div></div>`).join("")||`<p class="sub">No members yet. Add one above or import your list in Tools.</p>`}</div>`);
  $("#go").onclick=async()=>{const name=$("#mn").value.trim();if(!name)return toast("Enter a name");
    await setDoc(gdoc("members","m"+next),{memberNo:next,name,gender:$("#mg").value,village:$("#mvl").value.trim(),contact:$("#mc").value.trim(),joinDate:$("#mj").value,status:"Active"});toast("Member added")};
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const m=S.members.find(x=>x.id===b.dataset.st);updateDoc(gdoc("members",m.id),{status:m.status==="Inactive"?"Active":"Inactive"})});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const id=b.dataset.del;
    if(S.entries.some(e=>e.memberId===id))return toast("This member has records. Set them to Inactive instead");
    if(confirm("Delete this member?"))await deleteDoc(gdoc("members",id))});
};

/* ---------- LOANS ---------- */
function loans(){
  const c=cfg(),L=[],rep={};
  S.entries.filter(e=>N(e.loanTaken)>0).sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{const r=e.loanRate??c.interestRate,i=N(e.loanTaken)*r/100;
    L.push({date:e.date,mid:e.memberId,amount:N(e.loanTaken),rate:r,interest:i,due:N(e.loanTaken)+i,dueDate:AD(e.date,7*c.loanWeeks)})});
  S.entries.forEach(e=>rep[e.memberId]=(rep[e.memberId]||0)+N(e.loanRepayment));
  L.forEach(l=>{const t=Math.min(rep[l.mid]||0,l.due);rep[l.mid]=(rep[l.mid]||0)-t;l.repaid=t;l.out=l.due-t;l.status=l.out<=0?"Cleared":l.dueDate<iso(new Date())?"Overdue":"Active"});
  return L;
}
V.loans=()=>{
  const L=loans();
  body(`<div class="box stat"><div><div class="sub">Loaned out</div><div class="big">${money(L.reduce((a,l)=>a+l.amount,0))}</div></div><div><div class="sub">Interest due</div><div class="big">${money(L.reduce((a,l)=>a+l.interest,0))}</div></div><div><div class="sub">Repaid</div><div class="big">${money(L.reduce((a,l)=>a+l.repaid,0))}</div></div><div><div class="sub">Outstanding</div><div class="big">${money(L.reduce((a,l)=>a+l.out,0))}</div></div></div>
  <div class="box wide"><h2>Loan register</h2><p class="sub">Loans are recorded in the weekly Meeting sheet (Loan taken) and repaid there too (Loan repayment). Repayments clear the oldest loan first.</p>${L.length?`<table><tr><th>ID</th><th>Name</th><th>Date</th><th>Loan</th><th>Rate</th><th>Interest</th><th>Total due</th><th>Repaid</th><th>Outstanding</th><th>Due</th><th>Status</th></tr>${L.map(l=>`<tr><td>${mOf(l.mid).memberNo}</td><td>${esc(mOf(l.mid).name)}</td><td>${l.date}</td><td>${money(l.amount)}</td><td>${l.rate}%</td><td>${money(l.interest)}</td><td>${money(l.due)}</td><td>${money(l.repaid)}</td><td>${money(l.out)}</td><td>${l.dueDate}</td><td style="color:${l.status==="Overdue"?"var(--red)":l.status==="Cleared"?"var(--leaf)":"inherit"}">${l.status}</td></tr>`).join("")}</table>`:`<p class="sub">No loans yet.</p>`}</div>`);
};

/* ---------- SUMMARY ---------- */
V.summary=()=>{
  const L=loans(),rows=mem().map(m=>{const es=S.entries.filter(e=>e.memberId===m.id),att=es.filter(e=>e.attendance);
    return {m,sv:sumE(es,"savings"),ret:sumE(es,"retention"),sf:sumE(es,"socialFund"),fi:es.reduce((a,e)=>a+fines(e),0),out:L.filter(l=>l.mid===m.id).reduce((a,l)=>a+l.out,0),ap:att.length?Math.round(att.filter(e=>e.attendance!=="Absent").length/att.length*100):null}});
  const bk=book(),T=k=>sumE(S.entries,k),tot=T("savings"),ip=L.reduce((a,l)=>a+Math.max(0,l.repaid-l.amount),0),fi=S.entries.reduce((a,e)=>a+fines(e),0);
  const card=(l,v)=>`<div><div class="sub">${l}</div><div class="big">${money(v)}</div></div>`;
  body(`<div class="box stat">${card("Savings",tot)}${card("Social fund",T("socialFund"))}${card("Retention",T("retention"))}${card("Registration",T("registration"))}${card("Loan form fees",T("loanFormFee"))}${card("Fines",fi)}${card("Expenses",S.expenses.reduce((a,x)=>a+N(x.amount),0))}${card("Money in the box",bk.length?bk[bk.length-1].close:N(cfg().openingBalance))}${card("Loans outstanding",L.reduce((a,l)=>a+l.out,0))}${card("Interest earned",ip)}</div>
  <div class="box wide"><h2>Member totals and share-out</h2><p class="sub">Share-out = savings plus a share of interest earned, in proportion to each member's savings. Social fund, retention, registration and fines are not shared out.</p>
  <table><tr><th>ID</th><th>Name</th><th>Savings</th><th>Retention</th><th>Social</th><th>Fines</th><th>Loan owed</th><th>Attend.</th><th>Share-out</th></tr>${rows.map(r=>`<tr><td>${r.m.memberNo}</td><td>${esc(r.m.name)}</td><td>${money(r.sv)}</td><td>${money(r.ret)}</td><td>${money(r.sf)}</td><td>${money(r.fi)}</td><td>${money(r.out)}</td><td>${r.ap===null?"-":r.ap+"%"}</td><td><b>${money(tot?r.sv/tot*(tot+ip):0)}</b></td></tr>`).join("")}</table></div>
  <div class="box wide"><h2>Cash book (every meeting)</h2><table><tr><th>Wk</th><th>Date</th><th>Savings</th><th>Social</th><th>Fines</th><th>Loan fees</th><th>Repaid</th><th>Reg+Ret</th><th>Money in</th><th>Loans out</th><th>Expenses</th><th>In the box</th></tr>${[...bk].reverse().map(r=>`<tr><td>${wk(r.d)}</td><td>${r.d}</td><td>${money(r.sav)}</td><td>${money(r.sf)}</td><td>${money(r.fin)}</td><td>${money(r.fee)}</td><td>${money(r.rep)}</td><td>${money(r.reg+r.ret)}</td><td>${money(r.in)}</td><td>${money(r.loan)}</td><td>${money(r.exp)}</td><td><b>${money(r.close)}</b></td></tr>`).join("")||"<tr><td>No meetings yet</td></tr>"}</table></div>`);
};

/* ---------- TOOLS: calculators, settings, import ---------- */
V.tools=()=>{
  const c=cfg(),notes=[50000,20000,10000,5000,2000,1000,500,200,100],SK=[["interestRate","Loan interest (%)"],["loanWeeks","Loan period (weeks)"],["registrationFee","Registration fee"],["retentionPerWeek","Retention per week"],["absentFine","Absent fine"],["lateFine","Late fine"],["noiseFine","Noise fine"],["loanFormFee","Loan form fee"],["openingBalance","Opening balance in the box"]];
  body(`<div class="box"><h2>Calculator</h2><input id="ex" placeholder="e.g. 20000*12+5000" inputmode="text" aria-label="Expression"><div class="big" id="exr">0</div></div>
  <div class="box"><h2>Loan calculator</h2>${inp("lc_a","Loan amount","number")}${inp("lc_r","Interest (%)","number",c.interestRate)}${inp("lc_w","Weeks to repay","number",c.loanWeeks)}<p id="lcr" class="sub"></p></div>
  <div class="box"><h2>Cash counter</h2>${notes.map(n=>`<div class="row"><label for="n${n}" style="margin:0">${money(n)} × </label><input id="n${n}" data-n="${n}" type="number" inputmode="numeric" min="0" style="width:90px"></div>`).join("")}<div class="big" id="cct" style="margin-top:8px">0</div></div>
  <div class="box"><h2>Group settings</h2>${SK.map(([k,l])=>inp("s_"+k,l,"number",c[k])).join("")}${inp("s_savChips","Quick savings amounts (comma separated)","text",c.savChips)}${inp("s_sfChips","Quick social fund amounts (comma separated)","text",c.sfChips)}<button class="pri" id="ss">Save settings</button></div>
  <div class="box"><h2>Import from Excel (CSV)</h2><p class="sub">Choose members.csv first, then history.csv. Importing again updates records and does not duplicate them.</p><input id="imp" type="file" accept=".csv" aria-label="CSV file"></div>`);
  $("#ex").oninput=e=>{const x=e.target.value;try{$("#exr").textContent=/^[\d+\-*/().\s]+$/.test(x)?(+Function('"use strict";return ('+x+')')()).toLocaleString():"0"}catch{$("#exr").textContent="…"}};
  const lc=()=>{const a=N($("#lc_a").value),r=N($("#lc_r").value),w=N($("#lc_w").value),i=a*r/100;$("#lcr").innerHTML=a?`Interest <b>${money(i)}</b><br>Total to repay <b>${money(a+i)}</b>${w?`<br>Per week <b>${money((a+i)/w)}</b><br>Due by ${fmt(AD(iso(new Date()),7*w))}`:""}`:"Enter an amount."};
  ["lc_a","lc_r","lc_w"].forEach(i=>$("#"+i).oninput=lc);lc();
  document.querySelectorAll("[data-n]").forEach(i=>i.oninput=()=>$("#cct").textContent=money([...document.querySelectorAll("[data-n]")].reduce((a,x)=>a+N(x.value)*x.dataset.n,0)));
  $("#ss").onclick=async()=>{const s={};SK.forEach(([k])=>s[k]=N($("#s_"+k).value));s.savChips=$("#s_savChips").value.trim();s.sfChips=$("#s_sfChips").value.trim();await updateDoc(doc(db,"groups",S.gid),{settings:s});toast("Settings saved")};
  $("#imp").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    const rows=(await f.text()).trim().split(/\r?\n/).map(l=>l.split(",").map(x=>x.trim())),h=rows.shift(),ix=n=>h.indexOf(n),items=[];
    if(h.includes("Full Name"))rows.forEach(r=>{const no=+r[0];if(no)items.push([gdoc("members","m"+no),{memberNo:no,name:r[1],gender:r[2],village:r[3],contact:r[4],joinDate:r[5],status:r[6]||"Active"}])});
    else if(h.includes("Attendance")){const ds=new Set();rows.forEach(r=>{const d=r[ix("Date")],mid="m"+r[ix("Member ID")];if(!d)return;ds.add(d);const o={date:d,memberId:mid,attendance:r[ix("Attendance")]||""};
      KEYS.forEach(k=>o[k]=N(r[ix({registration:"Registration",retention:"Retention",savings:"Savings",socialFund:"Social Fund",loanTaken:"Loan Taken",loanRepayment:"Loan Repayment",loanFormFee:"Loan Form Fee",absentFine:"Absent Fine",lateFine:"Late Fine",noiseFine:"Noise Fine",otherFines:"Other Fines"}[k])]));
      o.totalFines=fines(o);o.totalPaid=paid(o);items.push([gdoc("entries",d+"_"+mid),o])});ds.forEach(d=>items.push([gdoc("meetings",d),{date:d}]))}
    else return toast("Unrecognised file. Use members.csv or history.csv");
    try{await bulk(items);toast("Imported "+items.length+" records")}catch(e){toast("Import failed: "+e.code)}ev.target.value=""};
};
</script>
