<style>

.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}

nav{display:flex;background:var(--card);border-top:1px solid var(--line)}

.stat[role=button]{cursor:pointer;transition:transform .1s}.stat[role=button]:hover{border-color:var(--acc)}.stat[role=button]:active{transform:scale(.97)}.stat.wide{grid-column:1/-1;background:var(--head);color:var(--headink);border-color:var(--head)}.stat.wide small{color:#cfc8bb}

.btn.big{background:var(--acc);color:var(--accink);border-color:var(--acc);font-size:17px}.btn.del{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.seg button{flex:1;min-width:30%;padding:9px 2px;font-size:13.5px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-weight:700;cursor:pointer}.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}

#ts{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--head);color:var(--headink);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;font-weight:700;box-shadow:0 2px 10px #0006}#ts.show{opacity:1;transform:translate(-50%,0)}

:root{--paper:var(--bg);--maize:var(--acc);--leaf:var(--ok);--red:var(--bad)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}

.dots{width:50px;background:none;border:0;border-left:1.5px solid var(--line);font-size:1.3rem;cursor:pointer}
.bds{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bd{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.bd.Present{background:var(--ok);color:#fff;border-color:var(--ok)}.bd.Late{background:var(--acc);color:var(--accink);border-color:var(--acc)}.bd.Absent{background:var(--bad);color:#fff;border-color:var(--bad)}
.brush{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:10px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;font-size:12px;color:var(--mut)}
.day{min-height:54px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;padding:2px}
.day.sun{border-color:var(--acc);border-style:dashed}.day.sat{border-style:dotted}
.day.held{background:var(--ok);color:#fff;border-style:solid;border-color:var(--ok)}.day.today{outline:2px solid var(--ink)}
.day small{display:block;font-size:11px;color:inherit}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#5aa2ff;--accink:#04162e}}
#bs{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--acc);color:var(--accink);font-weight:700;font-size:14px}#bs.bad{background:var(--bad);color:#fff}#bs button{margin-left:auto;border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:var(--head);color:var(--headink);cursor:pointer;white-space:nowrap}

</style>
</head><body>
<header><h1 id="hn">VSLA Group Book</h1><small id="ha"></small><button id="installApp" aria-label="Install app" style="position:absolute;right:54px;top:12px;height:34px;padding:0 9px;border:1px solid #5aa2ff;border-radius:8px;background:transparent;color:inherit;font-size:12px;font-weight:700;display:none">Install</button><button id="hb" aria-label="How to use this app" data-act="go" data-arg="help">?</button></header>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc as _addDoc,setDoc as _setDoc,updateDoc as _updateDoc,deleteDoc as _deleteDoc,writeBatch as _writeBatch,Timestamp,onSnapshot,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Your Firebase project settings */
const firebaseConfig = {
  apiKey: "AIzaSyAa46jt-G7Ma4aH8MHxvPnLf13L2yvgFpM",
  authDomain: "vsla-app-d70dd.firebaseapp.com",
  projectId: "vsla-app-d70dd",
  storageBucket: "vsla-app-d70dd.firebasestorage.app",
  messagingSenderId: "797658721016",
  appId: "1:797658721016:web:a05a0d765d218d543da90d"
};

const app=initializeApp(firebaseConfig), auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const S={user:null,groups:[],gid:null,members:[],meetings:[],entries:[],expenses:[],tab:"home",bill:null,admin:false,pay:null,myPays:[],nt:[[],[]],adm:{pays:[],bills:[],groups:[]},asub:"pay",msub:"sheet",sub:"loans",rsub:"meet",mq:"",mon:new Date().toISOString().slice(0,7),date:null,cal:new Date(),modal:false,brush:{g:"Attendance",k:"attendance",v:"Present",l:"Attendance: Present"},q:"",hide:false,pick:false};
let unsubs=[],gUn=[],watching=null;
const $=s=>document.querySelector(s),N=v=>+v||0,money=n=>Math.round(n||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{let e=$("#ts");if(!e){e=document.createElement("div");e.id="ts";document.body.appendChild(e)}e.textContent=m;e.className="show";clearTimeout(e.t);e.t=setTimeout(()=>e.className="",2400)};
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P=s=>{const[a,b,c]=s.split("-");return new Date(+a,b-1,+c)};
const AD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>P(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const G=()=>S.groups.find(g=>g.id===S.gid);
const cfg=()=>({interestRate:30,loanWeeks:4,registrationFee:0,retentionPerWeek:0,absentFine:0,lateFine:0,noiseFine:0,loanFormFee:0,openingBalance:0,savChips:"10000,20000",sfChips:"1000,2000,5000,10000",...(G()?.settings||{})});
const gcol=n=>collection(db,"groups",S.gid,n),gdoc=(n,id)=>doc(db,"groups",S.gid,n,id);
const mem=()=>[...S.members].sort((a,b)=>a.memberNo-b.memberNo);
const dates=()=>[...new Set([...S.meetings.map(m=>m.id),...S.entries.map(e=>e.date)])].sort();
const wk=d=>dates().indexOf(d)+1;
const fines=e=>N(e.absentFine)+N(e.lateFine)+N(e.noiseFine)+N(e.otherFines);
// Total Paid = cash the member hands in this week. Loan Taken is cash going out, so it is not included.
const paid=e=>N(e.registration)+N(e.retention)+N(e.savings)+N(e.socialFund)+N(e.loanRepayment)+N(e.loanFormFee)+fines(e);
const mOf=id=>S.members.find(m=>m.id===id)||{name:"Unknown",memberNo:"?"};
const sumE=(es,k)=>es.reduce((a,e)=>a+N(e[k]),0);
async function bulk(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(([r,d])=>b.set(r,d,{merge:true}));await b.commit()}}
window.addEventListener("online",()=>toast("Back online"));
window.addEventListener("offline",()=>toast("Offline: saving on this phone"));

/* ---------- AUTH ---------- */
const emailOf=p=>p.replace(/\D/g,"")+"@savingsbook.app";
function stop(){unsubs.forEach(f=>f());unsubs=[];admUn.forEach(f=>f());admUn=[];gUn.forEach(f=>f());gUn=[];watching=null}
function login(){
  stop();$("#nv").innerHTML="";$("#cb").hidden=true;$("#hn").textContent="VSLA Group Book";$("#ha").textContent="";
  $("#main").innerHTML=`<div class="box"><h2>Sign in</h2><label for="ph">Phone number</label><input id="ph" inputmode="tel" placeholder="0772123456"><label for="pin">6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6"><button class="pri" id="in">Sign in</button><button class="pri" id="up" style="background:var(--leaf);color:#fff">Create account</button></div>`;
  const run=async fn=>{const ph=$("#ph").value,pin=$("#pin").value;
    if(ph.replace(/\D/g,"").length<9||!/^\d{6}$/.test(pin))return toast("Enter a valid phone number and a 6-digit PIN");
    try{await fn(auth,emailOf(ph),pin)}catch(e){toast(e.code==="auth/invalid-credential"?"Wrong phone number or PIN":e.code==="auth/email-already-in-use"?"Account exists. Sign in instead":"Could not sign in: "+e.code)}};
  $("#in").onclick=()=>run(signInWithEmailAndPassword);$("#up").onclick=()=>run(createUserWithEmailAndPassword);
}
onAuthStateChanged(auth,u=>{
  S.user=u;stop();S.bill=null;S.admin=false;paintStrip();if(!u)return login();
  billingWatch(u);
  unsubs.push(onSnapshot(query(collection(db,"groups"),where("ownerId","==",u.uid)),snap=>{
    S.groups=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.groups.find(g=>g.id===S.gid))S.gid=S.groups[0]?.id||null;
    if(!S.gid)return createGroup();
    watch();$("#body")?refresh():shell();
  }));
});
function createGroup(){
  $("#nv").innerHTML="";$("#cb").hidden=true;
  $("#main").innerHTML=`<div class="box"><h2>Create your group</h2><label for="gn">Group name</label><input id="gn" placeholder="e.g. OYBA Build Up"><button class="pri" id="mk">Create group</button><button class="lnk" id="out">Sign out</button></div>`;
  $("#mk").onclick=async()=>{const name=$("#gn").value.trim();if(!name)return toast("Enter a group name");
    await addDoc(collection(db,"groups"),{name,ownerId:S.user.uid,createdAt:serverTimestamp()})};
  $("#out").onclick=()=>signOut(auth);
}
function watch(){
  if(watching===S.gid)return;gUn.forEach(f=>f());gUn=[];watching=S.gid;
  [["members","members"],["meetings","meetings"],["entries","entries"],["expenses","expenses"]].forEach(([n,k])=>gUn.push(onSnapshot(gcol(n),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(k==="members")fixIds();refresh()})));
}

// Members created by the first version have no ID number: number them once, in the order they were added.
function fixIds(){const miss=S.members.filter(m=>!m.memberNo);if(!miss.length)return;let n=S.members.reduce((a,m)=>Math.max(a,m.memberNo||0),0);
  miss.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).forEach(m=>_updateDoc(gdoc("members",m.id),{memberNo:++n,status:m.status||"Active",gender:m.gender||"",village:m.village||"",contact:m.contact||m.phone||"",joinDate:m.joinDate||""}))}


/* ---------- TEMPLATE HELPERS (same look as the hardware app) ---------- */
const V={};
const TABS=[["home","Home"],["meeting","Meeting"],["members","Members"],["money","Money"],["rep","Reports"],["set","Setup"]];
const card=(l,v,o={})=>`<div class="stat${o.w?" wide":""}"${o.g?` role="button" tabindex="0" data-act="go" data-arg="${o.g}"`:""}><small>${l}</small><span class="num ${o.c||""}">${v}</span></div>`;
const item=(t,s,r,a,cls="")=>{const tg=a?"button":"div";return `<${tg} class="item"${a?` data-act="${a[0]}" data-arg="${esc(a[1])}"`:' style="cursor:default"'}><span class="nm"><b>${t}</b><small>${s||""}</small></span><span class="pr ${cls}">${r??""}</span></${tg}>`};
const seg=(arr,cur,act)=>`<div class="seg">${arr.map(([k,l])=>`<button class="${cur===k?"on":""}" data-act="${act}" data-arg="${k}">${l}</button>`).join("")}</div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const body=h=>$("#body").innerHTML=h;
const inp=(id,l,t="text",v="",x="")=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==="number"?'inputmode="numeric" min="0"':""} value="${esc(v)}" ${x}>`;
const sumA=(a,f)=>a.reduce((x,y)=>x+f(y),0);
/* Every write below goes through the subscription lock: after the trial, records can be viewed and downloaded but not changed. */
const denied=()=>{toast("Your free trial has ended. You can still view and download your data. Subscribe to update records.");const e=new Error("read-only");e.code="read-only";const p=Promise.reject(e);p.catch(()=>{});return p};
const gd=()=>{if(locked()){denied();return true}return false};
const fail=x=>{if(!x||x.code!=="read-only")toast("Could not save: "+(x&&x.code))};
const setDoc=(...a)=>locked()?denied():_setDoc(...a);
const updateDoc=(...a)=>locked()?denied():_updateDoc(...a);
const addDoc=(...a)=>locked()?denied():_addDoc(...a);
const deleteDoc=(...a)=>locked()?denied():_deleteDoc(...a);
const writeBatch=(...a)=>{const b=_writeBatch(...a),o={};["set","update","delete"].forEach(m=>o[m]=(...x)=>{b[m](...x);return o});o.commit=()=>locked()?denied():b.commit();return o};
function modal(h){const m=$("#md");S.modal=!!h;if(!h){m.classList.add("hide");m.innerHTML="";return}m.innerHTML="<div>"+h+"</div>";m.classList.remove("hide")}
$("#md").onclick=e=>{if(e.target.id==="md"){modal();refresh(true)}};
function form(title,F,v,onsave,del){
  modal(`<h2>${title}</h2>`+F.map(([k,l,t,o])=>`<label for="f_${k}">${l}</label>`+(t==="select"?`<select id="f_${k}">${o.map(x=>`<option ${x===v[k]?"selected":""}>${esc(x)}</option>`).join("")}</select>`:`<input id="f_${k}" type="${t}" ${t==="number"?'inputmode="numeric"':""} value="${esc(v[k]??"")}">`)).join("")+`<button class="btn big" id="fs">Save</button>${del?`<button class="btn del" id="fd">Delete</button>`:""}<button class="btn" id="fc">Cancel</button>`);
  const done=()=>{modal();refresh(true)};
  $("#fc").onclick=done;
  $("#fs").onclick=async()=>{if(gd())return;const r={};F.forEach(([k,,t])=>{const x=$("#f_"+k).value;r[k]=t==="number"?N(x):x.trim()});if(await onsave(r)!==false)done()};
  if(del)$("#fd").onclick=async()=>{if(confirm("Delete this record?")){await del();done()}};
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

async function moveMeeting(a,b){

function loans(){
  const c=cfg(),L=[],rep={};
  S.entries.filter(e=>N(e.loanTaken)>0).sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{const r=e.loanRate??c.interestRate,i=N(e.loanTaken)*r/100;
    L.push({date:e.date,mid:e.memberId,amount:N(e.loanTaken),rate:r,interest:i,due:N(e.loanTaken)+i,dueDate:AD(e.date,7*c.loanWeeks)})});
  S.entries.forEach(e=>rep[e.memberId]=(rep[e.memberId]||0)+N(e.loanRepayment));
  L.forEach(l=>{const t=Math.min(rep[l.mid]||0,l.due);rep[l.mid]=(rep[l.mid]||0)-t;l.repaid=t;l.out=l.due-t;l.status=l.out<=0?"Cleared":l.dueDate<iso(new Date())?"Overdue":"Active"});
  return L;
}

let cx="";
function ev(s){s=s.replace(/[+\-*/.]+$/,'').replace(/(^|[^\d.])0+(?=\d)/g,'$1');if(!s||!/^[0-9+\-*/. ]+$/.test(s))return null;try{const v=Function('return '+s)();return isFinite(v)?Math.round(v*1e8)/1e8:null}catch(e){return null}}
function calc(){cx='';const K=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','00','='];
modal('<h2>Calculator</h2><div class="stat wide" style="text-align:right"><small id="ce" style="min-height:1.3em;display:block;overflow-wrap:anywhere"></small><span class="num" id="cr" style="font-size:30px">0</span></div><div class="kp">'+K.map(k=>'<button class="'+('÷×−+='.includes(k)?'op':k=='C'||k=='⌫'?'fn':'')+'" onclick="kp(\''+k+'\')">'+k+'</button>').join('')+'</div><button class="btn" data-act="loancalc">Loan calculator</button><button class="btn" data-act="cashcount">Cash counter</button><button class="btn" onclick="modal()">Close</button>')}
function kp(k){const op=/[+\-*/]$/;
if(k=='C')cx='';else if(k=='⌫')cx=cx.slice(0,-1);
else if(k=='=')cx=String(ev(cx)??cx);

const DAY=864e5,E=()=>{};
const tms=x=>x&&x.toMillis?x.toMillis():x&&x.seconds?x.seconds*1000:0;
const fmtD=ms=>new Date(ms).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
function bstat(b=S.bill,adm=S.admin){
  if(!b)return{k:"load"};
  if(adm||b.free)return{k:"free"};
  const now=Date.now(),pu=tms(b.paidUntil);
  if(pu>now)return{k:"paid",until:pu,left:Math.ceil((pu-now)/DAY)};
  const end=(tms(b.trialStart)||now)+N(b.trialDays)*DAY;
  return now<end?{k:"trial",until:end,left:Math.ceil((end-now)/DAY)}:{k:"expired",until:Math.max(end,pu)};
}
function locked(){return bstat().k==="expired"}
/* reminders: in-app notices (and WhatsApp links) before a trial or subscription ends */
const stageOf=s=>s.k==="expired"?"x":(s.k==="trial"||s.k==="paid")?(s.left<=1?"d1":s.left<=5?"d5":null):null;
function remMsg(s){
  const p=S.pay||{},pr=N(p.price)?` The fee is UGX ${money(p.price)} per month, paid by mobile money.`:"";
  if(s.k==="expired")return{title:"Your trial has ended",body:`Your records are safe and you can still view and download them. To update records again, subscribe from Setup > Subscribe.${pr}`};
  const t=s.k==="trial";return{title:`Your ${t?"free trial":"subscription"} ends in ${dy(s.left)}`,body:`To keep updating your records after ${fmtD(s.until)}, ${t?"subscribe":"renew"} from Setup > Subscribe.${pr}`};
}
function waLink(phone,text){let d=String(phone||"").replace(/\D/g,"");if(d.startsWith("0"))d="256"+d.slice(1);else if(d.length<=9)d="256"+d;return "https://wa.me/"+d+"?text="+encodeURIComponent(text)}
let remDone=false,remT=0;
async function autoRemind(force){
  if(!S.admin)return;
  if(!force&&(remDone||(S.pay&&S.pay.autoRemind===false)))return;
  remDone=true;
  const due=S.adm.bills.filter(b=>{if(b.id===S.user.uid)return false;const s=bstat(b,false),st=stageOf(s);return st&&(force||b.remind!==s.until+":"+st)});
  if(!due.length){if(force)toast("No reminders needed right now");return}
  const wb=_writeBatch(db);
  due.forEach(b=>{const s=bstat(b,false),m=remMsg(s);wb.set(doc(collection(db,"notices")),{to:b.id,title:m.title,body:m.body,at:serverTimestamp()});wb.update(doc(db,"billing",b.id),{remind:s.until+":"+stageOf(s)})});
  try{await wb.commit();toast("Reminders sent to "+due.length+" client"+(due.length>1?"s":""))}catch(e){toast("Could not send: "+e.code)}
}
const dy=n=>n+" day"+(n>1?"s":"");
const sline=s=>({free:"Free account",paid:`Premium until ${fmtD(s.until)} (${dy(s.left)} left)`,trial:`Free trial: ${dy(s.left)} left`,expired:"Trial ended: view and download only",load:"Checking subscription…"}[s.k]);
let admUn=[];
function billingWatch(u){
  const bd=doc(db,"billing",u.uid);let made=false;
  unsubs.push(onSnapshot(bd,s=>{
    if(!s.exists()){if(!made){made=true;_setDoc(bd,{plan:"group",trialStart:serverTimestamp(),trialDays:14,paidUntil:null,free:false,phone:(u.email||"").split("@")[0]}).catch(()=>{made=false})}return}
    S.bill=s.data();paintStrip();refresh()},E));
  unsubs.push(onSnapshot(doc(db,"admins",u.uid),s=>{S.admin=s.exists();admWatch();paintStrip();refresh()},E));
  unsubs.push(onSnapshot(doc(db,"platform","pay"),s=>{S.pay=s.exists()?s.data():null},E));
  unsubs.push(onSnapshot(query(collection(db,"payments"),where("uid","==",u.uid)),s=>{S.myPays=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b.at)-tms(a.at))},E));
  ["all",u.uid].forEach((to,i)=>unsubs.push(onSnapshot(query(collection(db,"notices"),where("to","==",to)),s=>{S.nt[i]=s.docs.map(d=>({id:d.id,...d.data()}));noticeToast();refresh()},E)));
}
function admWatch(){
  admUn.forEach(f=>f());admUn=[];if(!S.admin){remDone=false;remT=0;return}
  [["payments","pays"],["billing","bills"],["groups","groups"]].forEach(([n,k])=>admUn.push(onSnapshot(collection(db,n),s=>{S.adm[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(n==="billing"&&!remT)remT=setTimeout(()=>autoRemind(),1500);paintStrip();refresh()},E)));
}
function paintStrip(){
  const el=$("#bs");if(!el)return;const s=bstat(),pend=S.admin?S.adm.pays.filter(p=>p.status==="pending").length:0;let h="",bad=false;
  if(pend)h=`<span>${pend} payment request${pend>1?"s":""} waiting</span><button data-act="adm">Review</button>`;
  else if(s.k==="expired"){bad=true;h=`<span>Trial ended: you can view and download, but not update.</span><button data-act="sub">Subscribe</button>`}
  else if((s.k==="trial"||s.k==="paid")&&s.left<=5)h=`<span>${s.k==="trial"?"Free trial":"Subscription"} ends in ${dy(s.left)}</span><button data-act="sub">${s.k==="trial"?"Subscribe":"Renew"}</button>`;
  el.className=h?(bad?"bad":""):"hide";el.innerHTML=h;
  const sc=$("#subcard");if(sc)sc.innerHTML=subInner();
}
const subInner=()=>{const s=bstat(),n=S.admin?S.adm.pays.filter(p=>p.status==="pending").length:0;
  return `<div class="stat wide" style="margin-bottom:8px"><small>Subscription</small><span class="num" style="font-size:16px">${sline(s)}</span></div>${s.k==="free"?"":`<button class="btn big" data-act="sub" style="margin:0 0 6px">${s.k==="paid"?"Renew subscription":"Subscribe"}</button>`}${S.admin?`<button class="btn" data-act="adm" style="margin:0 0 6px">Admin screen${n?" ("+n+" waiting)":""}</button>`:""}`};
const subCard=()=>`<div id="subcard">${subInner()}</div>`;
/* messages from the system owner */
const seenN=()=>{try{return JSON.parse(localStorage.getItem("vsla_seen")||"[]")}catch{return[]}};
const notices=()=>[...S.nt[0],...S.nt[1]].sort((a,b)=>tms(b.at)-tms(a.at));
const unseen=()=>notices().filter(n=>!seenN().includes(n.id));
const nKnown=new Set();
function noticeToast(){const f=unseen().filter(n=>!nKnown.has(n.id));unseen().forEach(n=>nKnown.add(n.id));if(f.length)toast(f[0].title)}
const noticeCards=()=>unseen().slice(0,3).map(n=>`<div class="stat wide" style="margin-bottom:8px"><small>Message</small><b>${esc(n.title)}</b><div>${esc(n.body)}</div><button class="btn" data-act="seen" data-arg="${n.id}" style="margin-top:6px;color:var(--ink)">OK</button></div>`).join("");
/* client: pay and send the transaction ID */
function openSub(){
  const s=bstat(),p=S.pay,price=N(p&&p.price);
  const hist=S.myPays.slice(0,5).map(x=>item(`${money(x.amount)} · ${x.months} month${x.months>1?"s":""}`,`${esc(x.txn)} · ${fmtD(tms(x.at)||Date.now())}`,x.status==="approved"?"Confirmed":x.status==="rejected"?"Rejected":"Waiting",null,x.status==="approved"?"ok":x.status==="rejected"?"low":"")).join("");
  modal(`<h2>Subscribe</h2><div class="stat wide"><small>${sline(s)}</small><span class="num">${price?"UGX "+money(price)+" per month":"Price not set yet"}</span></div>`+(p&&p.phone?`<h3>1. Send the money by mobile money to</h3><div class="stat"><span class="num">${esc(p.phone)}</span><small>${esc(p.name||"")}</small></div><h3>2. Enter the details from your payment message</h3><label for="pm">Months to pay for</label><select id="pm">${[1,2,3,6,12].map(m=>`<option value="${m}">${m} month${m>1?"s":""}${price?" · UGX "+money(price*m):""}</option>`).join("")}</select><label for="pt">Transaction ID</label><input id="pt" placeholder="From the payment message"><label for="pf">Number you paid from</label><input id="pf" inputmode="tel"><label for="pn">Name on that number</label><input id="pn"><button class="btn big" id="ps">Send payment details</button><small>You will get a message here when your payment is confirmed. Your records are never deleted.</small>`:`<div class="empty">Payment details are not available yet. Please contact the system owner.</div>`)+(hist?`<h3>Your payments</h3>${hist}`:"")+`<button class="btn" id="px">Close</button>`);
  if($("#ps"))$("#ps").onclick=sendPay;$("#px").onclick=()=>modal();
}
function sendPay(){
  const p=S.pay,m=N($("#pm").value),txn=$("#pt").value.trim(),from=$("#pf").value.trim(),name=$("#pn").value.trim();
  if(txn.length<3||from.length<6||!name)return toast("Enter the transaction ID, your number and the name");
  if(S.myPays.some(x=>String(x.txn).toLowerCase()===txn.toLowerCase()))return toast("You already sent this transaction ID");
  _addDoc(collection(db,"payments"),{uid:S.user.uid,txn,from,name,months:m,amount:N(p.price)*m,status:"pending",at:serverTimestamp()}).catch(e=>toast("Could not send: "+e.code));
  modal();toast(navigator.onLine?"Sent. You will get a message when it is confirmed.":"Saved. It will be sent when you are online.");
}
/* system owner (admin) screens */
const lab=u=>{const g=S.adm.groups.find(x=>x.ownerId===u),b=S.adm.bills.find(x=>x.id===u);return esc(g?g.name:"New client")+" · "+esc((b&&b.phone)||u.slice(0,6))};
V.admin=()=>{
  if(!S.admin)return body(empty("Not available"));
  const A=S.adm,a=S.asub,sg=seg([["pay","Payments"],["cl","Clients"],["msg","Message"],["det","Pay details"]],a,"asub"),back=`<button class="btn" data-act="go" data-arg="set" style="margin:0 0 8px">← Back to Setup</button>`;
  if(a==="pay"){const P=[...A.pays].sort((x,y)=>tms(y.at)-tms(x.at)),pend=P.filter(p=>p.status==="pending"),done=P.filter(p=>p.status!=="pending").slice(0,20);
    return body(back+sg+`<h3>Waiting (${pend.length})</h3>`+(pend.map(p=>item(lab(p.uid),`${esc(p.txn)} · from ${esc(p.from)} · ${p.months} month${p.months>1?"s":""}`,money(p.amount),["pdet",p.id])).join("")||empty("No payments waiting"))+`<small>Before approving, check your own mobile money message: the amount, the sender number and the transaction ID must match.</small><h3>Recent</h3>`+(done.map(p=>item(lab(p.uid),`${esc(p.txn)} · ${fmtD(tms(p.at))}`,p.status==="approved"?"Approved":"Rejected",null,p.status==="approved"?"ok":"low")).join("")||empty("Nothing yet")))}
  if(a==="cl"){const dueN=A.bills.filter(b=>b.id!==S.user.uid&&stageOf(bstat(b,false))).length;body(back+sg+`<div class="cards">${card("Clients",A.bills.length)}${card("Paying",A.bills.filter(b=>bstat(b,false).k==="paid").length,{c:"ok"})}${card("On trial",A.bills.filter(b=>bstat(b,false).k==="trial").length)}${card("Expired",A.bills.filter(b=>bstat(b,false).k==="expired").length,{c:"low"})}</div><button class="btn big" id="rm_all" style="margin:0 0 10px">Send reminders now (${dueN} due)</button><small>Reminders also go out by themselves when you open the app: once at 5 days left, once at 1 day left and once when the time has ended. Tap a client to send a WhatsApp reminder.</small>`+(A.bills.map(b=>item(lab(b.id),sline(bstat(b,false)),"",["cdet",b.id],bstat(b,false).k==="expired"?"low":"")).join("")||empty("No clients yet")));$("#rm_all").onclick=()=>autoRemind(true);return}
  if(a==="msg")return body(back+sg+`<h3>Send a message to clients</h3><label for="am_to">To</label><select id="am_to"><option value="all">All clients</option>${A.bills.map(b=>`<option value="${b.id}">${lab(b.id)}</option>`).join("")}</select>${inp("am_t","Title")}<label for="am_b">Message</label><textarea id="am_b" rows="4"></textarea><button class="btn big" id="am_s">Send message</button>`)||($("#am_s").onclick=()=>{const title=$("#am_t").value.trim(),b=$("#am_b").value.trim();if(!title||!b)return toast("Enter a title and a message");_addDoc(collection(db,"notices"),{to:$("#am_to").value,title,body:b,at:serverTimestamp()}).then(()=>{$("#am_t").value=$("#am_b").value="";toast("Message sent")}).catch(e=>toast("Could not send: "+e.code))});
  const p=S.pay||{};body(back+sg+`<h3>Where clients pay</h3>${inp("pd_p","Your mobile money number","tel",p.phone||"")}${inp("pd_n","Fully registered name on that number","text",p.name||"")}${inp("pd_m","Price per month (UGX)","number",p.price||"")}<label for="pd_a">Automatic reminders to clients</label><select id="pd_a"><option value="on" ${p.autoRemind===false?"":"selected"}>On</option><option value="off" ${p.autoRemind===false?"selected":""}>Off</option></select><button class="btn big" id="pd_s">Save payment details</button>`);
  $("#pd_s").onclick=()=>{const o={phone:$("#pd_p").value.trim(),name:$("#pd_n").value.trim(),price:N($("#pd_m").value),autoRemind:$("#pd_a").value!=="off"};if(!o.phone||!o.name||!(o.price>0))return toast("Fill in all three");_setDoc(doc(db,"platform","pay"),o).then(()=>toast("Saved")).catch(e=>toast("Could not save: "+e.code))};
};
function payDetail(id){
  const p=S.adm.pays.find(x=>x.id===id);if(!p)return;
  modal(`<h2>${lab(p.uid)}</h2><div class="cards">${card("Amount","UGX "+money(p.amount),{w:1})}${card("Months",p.months)}${card("Sent",fmtD(tms(p.at)||Date.now()))}${card("Transaction ID",esc(p.txn))}${card("Paid from",esc(p.from))}${card("Name",esc(p.name))}</div><small>Check your mobile money message before approving.</small><button class="btn big" id="pa">Approve</button><button class="btn del" id="pr">Reject</button><button class="btn" id="pc">Close</button>`);
  $("#pa").onclick=()=>decide(p,true);$("#pr").onclick=()=>decide(p,false);$("#pc").onclick=()=>{modal();refresh(true)};
}
async function decide(p,ok){
  const b=S.adm.bills.find(x=>x.id===p.uid),until=Math.max(Date.now(),tms(b&&b.paidUntil))+p.months*30*DAY,wb=_writeBatch(db);
  wb.update(doc(db,"payments",p.id),{status:ok?"approved":"rejected",decidedAt:serverTimestamp()});
  if(ok)wb.update(doc(db,"billing",p.uid),{paidUntil:Timestamp.fromMillis(until)});
  wb.set(doc(collection(db,"notices")),{to:p.uid,title:ok?"Payment confirmed":"Payment not confirmed",body:ok?`Thank you. Your subscription is active until ${fmtD(until)}.`:`We could not confirm your payment of ${money(p.amount)} (ID ${p.txn}). Please check the details and send again, or contact us.`,at:serverTimestamp()});
  try{await wb.commit();modal();toast(ok?"Approved":"Rejected");refresh(true)}catch(e){toast("Could not save: "+e.code)}
}
function clientDetail(uid){
  const b=S.adm.bills.find(x=>x.id===uid);if(!b)return;const s=bstat(b,false);
  modal(`<h2>${lab(uid)}</h2><div class="stat wide"><small>${sline(s)}</small></div><button class="btn" id="cd1">Add paid days</button><button class="btn" id="cd2">Extend trial (days)</button><button class="btn" id="cd3">${b.free?"Remove free access":"Make free"}</button>${s.k==="free"?"":`<button class="btn" id="cd5">WhatsApp reminder</button>`}<button class="btn" id="cd4">Close</button>`);
  const up=o=>_updateDoc(doc(db,"billing",uid),o).then(()=>{modal();toast("Saved")}).catch(e=>toast("Could not save: "+e.code));
  $("#cd1").onclick=()=>{const d=Math.round(N(prompt("Add how many paid days?","30")));if(d>0)up({paidUntil:Timestamp.fromMillis(Math.max(Date.now(),tms(b.paidUntil))+d*DAY)})};
  $("#cd2").onclick=()=>{const d=Math.round(N(prompt("Add how many trial days?","7")));if(d>0)up({trialDays:Math.round(N(b.trialDays))+d})};
  $("#cd3").onclick=()=>up({free:!b.free});$("#cd4").onclick=()=>modal();
  if($("#cd5"))$("#cd5").onclick=()=>{const m=remMsg(s);window.open(waLink(b.phone,m.title+"\n"+m.body+"\n"+location.href.split("?")[0]),"_blank")};
}
/* ---------- INSTALL + OFFLINE ---------- */
let dip=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;$("#installApp").style.display="block"});
$("#installApp").onclick=async()=>{if(dip){dip.prompt();await dip.userChoice;dip=null;$("#installApp").style.display="none"}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
