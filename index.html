<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2723">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>VSLA Group Book</title>
<style>

:root{--bg:#f4f1ec;--card:#fff;--ink:#22201c;--mut:#6b655b;--line:#ddd6ca;--acc:#f28c00;--accink:#2a1700;--head:#2b2723;--headink:#fff;--ok:#18794e;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#242120;--ink:#efeae2;--mut:#a39b8d;--line:#3a3530;--head:#0f0e0d;--ok:#4cc38a;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#171513;--card:#242120;--ink:#efeae2;--mut:#a39b8d;--line:#3a3530;--head:#0f0e0d;--ok:#4cc38a;--bad:#ff7a6b}
*{box-sizing:border-box}html{height:100%}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:relative;background:var(--head);color:var(--headink);padding:12px 54px 10px 16px}#hb{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);background:none;color:var(--headink);font-weight:800;font-size:17px;cursor:pointer}details{background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 14px}summary{padding:12px 0;font-weight:700;cursor:pointer}details ol,details ul{padding-left:20px;margin:0 0 12px}details li{margin-bottom:6px}details p{margin:0 0 12px}
h1{margin:0;font-size:19px}h1:before{content:"";display:inline-block;width:14px;height:14px;background:var(--acc);margin-right:8px;transform:rotate(45deg) scale(.8)}
header small{opacity:.75;font-size:12.5px}
h2{margin:12px 0 8px;font-size:19px}h3{margin:12px 0 6px;font-size:14px;color:var(--mut)}
main{flex:1;overflow:auto;padding:12px 14px;width:100%;max-width:960px;margin:0 auto}
.hide{display:none!important}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 3px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.nm{flex:1;min-width:0}.item b{display:block;overflow-wrap:anywhere}small{color:var(--mut)}
.pr{font-weight:700;white-space:nowrap;text-align:right}.low{color:var(--bad);font-weight:700}.ok{color:var(--ok)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px 1px;border:0;background:none;font-weight:700;font-size:13px;color:var(--mut);border-top:4px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-top-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block}.stat .num{font-size:20px;font-weight:800}
.stat[role=button]{cursor:pointer;transition:transform .1s}.stat[role=button]:hover{border-color:var(--acc)}.stat[role=button]:active{transform:scale(.97)}.stat.wide{grid-column:1/-1;background:var(--head);color:var(--headink);border-color:var(--head)}.stat.wide small{color:#cfc8bb}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;margin-top:8px;cursor:pointer}
.btn.big{background:var(--acc);color:var(--accink);border-color:var(--acc);font-size:17px}.btn.del{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.seg button{flex:1;min-width:30%;padding:9px 2px;font-size:13.5px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-weight:700;cursor:pointer}.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.empty{color:var(--mut);text-align:center;padding:20px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:6px 0 4px}.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.lab{display:flex;gap:6px}.lab small{flex:1;text-align:center;font-size:11px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card)}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-size:12px}
.qty{display:flex;gap:6px}.qty input{margin:0;padding:8px}
#md{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#md>div{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#cb{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:23px;box-shadow:0 2px 8px #0006;z-index:5;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.kp button{padding:15px 0;font-size:21px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.kp .op{background:var(--acc);border-color:var(--acc);color:var(--accink)}.kp .fn{color:var(--bad)}
.tw tr.tap{cursor:pointer}.tw tr.tap td:first-child{color:var(--acc);font-weight:700;text-decoration:underline dotted}.tw tr.tap:hover td{background:rgba(242,140,0,.12)}.tw tr.tap:active td{background:rgba(242,140,0,.22)}
#ts{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--head);color:var(--headink);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;font-weight:700;box-shadow:0 2px 10px #0006}#ts.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes sl{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
main>*{animation:up .22s ease both}#md>div{animation:sl .22s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#pv{background:#fff;color:#000;border-radius:10px;padding:14px;margin:10px 0}#pv h2,#pv h3,#pv h4{margin:4px 0;color:#000}#pv table{background:#fff;color:#000;font-size:14px}#pv td{white-space:normal;padding:5px 4px;border-bottom:1px solid #ccc}#pv td:last-child{text-align:right;font-weight:700;white-space:nowrap}#pv td:nth-child(2){text-align:left;color:#555}.pcat{break-inside:avoid;margin-bottom:10px}.pcat h4{background:#f28c00;color:#2a1700!important;padding:3px 6px}.chk{display:flex;gap:8px;align-items:center;margin:0 0 6px}.chk input{width:auto;margin:0}

:root{--paper:var(--bg);--maize:var(--acc);--leaf:var(--ok);--red:var(--bad)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.pri{display:block;width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--acc);background:var(--acc);color:var(--accink);font-weight:700;font-size:17px;margin-top:8px;cursor:pointer}
.sec{display:block;width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;margin-top:8px;cursor:pointer}
.lnk{background:none;border:0;color:var(--bad);font-weight:700;cursor:pointer;padding:4px}
.sub{font-size:13px;color:var(--mut)}.stat.wide .sub{color:#cfc8bb}.stat.wide .sec{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.r2{display:flex;gap:8px}.r2>*{flex:1}
.num{font-variant-numeric:tabular-nums}
.mr{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.mrow{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:6px 12px;background:none;border:0;text-align:left;cursor:pointer}
.dots{width:50px;background:none;border:0;border-left:1.5px solid var(--line);font-size:1.3rem;cursor:pointer}
.bds{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bd{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.bd.Present{background:var(--ok);color:#fff;border-color:var(--ok)}.bd.Late{background:var(--acc);color:var(--accink);border-color:var(--acc)}.bd.Absent{background:var(--bad);color:#fff;border-color:var(--bad)}
.brush{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:10px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;font-size:12px;color:var(--mut)}
.day{min-height:54px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;padding:2px}
.day.sun{border-color:var(--acc);border-style:dashed}.day.sat{border-style:dotted}
.day.held{background:var(--ok);color:#fff;border-style:solid;border-color:var(--ok)}.day.today{outline:2px solid var(--ink)}
.day small{display:block;font-size:11px;color:inherit}

header{display:flex;align-items:center;gap:10px}#hlogo{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none;background:#fff}header.hl h1:before{display:none}
:root{--hl:#fff3a8}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#4a4210}}:root[data-theme="dark"]{--hl:#4a4210}
.mr.pre{background:var(--hl);border-color:#e6c200}.bd.pre,.bd.adv{background:#ffe066;color:#3a2f00;border-color:#e0b800}
.ws th,.ws td{padding:4px 5px}.ws input,.ws select{width:86px;margin:0;padding:8px 6px;text-align:right}.ws select{width:58px;text-align:left}.ws input[disabled]{opacity:.4}.stk{position:sticky;left:0;background:var(--card);z-index:1;min-width:132px;max-width:160px;white-space:normal!important;text-align:left!important;box-shadow:1px 0 0 var(--line)}.fb{min-width:50px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-weight:700;cursor:pointer}
</style>
</head><body>
<header><img id="hlogo" alt="" hidden><div><h1 id="hn">VSLA Group Book</h1><small id="ha"></small></div><button id="installApp" aria-label="Install app" style="position:absolute;right:54px;top:12px;height:34px;padding:0 9px;border:1px solid #f28c00;border-radius:8px;background:transparent;color:inherit;font-size:12px;font-weight:700;display:none">Install</button><button id="hb" aria-label="How to use this app" data-act="go" data-arg="help">?</button></header>
<main id="main"></main>
<nav id="nv"></nav>
<button id="cb" aria-label="Calculator" data-act="calc" hidden>🧮</button>
<div id="md" class="hide"></div>
<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,writeBatch,onSnapshot,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Your Firebase project settings */
const firebaseConfig = {
  apiKey: "AIzaSyAa46jt-G7Ma4aH8MHxvPnLf13L2yvgFpM",
  authDomain: "vsla-app-d70dd.firebaseapp.com",
  projectId: "vsla-app-d70dd",
  storageBucket: "vsla-app-d70dd.firebasestorage.app",
  messagingSenderId: "797658721016",
  appId: "1:797658721016:web:a05a0d765d218d543da90d"
};

const app=initializeApp(firebaseConfig), auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const S={user:null,groups:[],gid:null,members:[],meetings:[],entries:[],expenses:[],tab:"home",msub:"week",sub:"loans",rsub:"week",mq:"",mon:new Date().toISOString().slice(0,7),date:null,cal:new Date(),modal:false,brush:{g:"Attendance",k:"attendance",v:"Present",l:"Attendance: Present"},q:"",hide:false,pick:false};
let unsubs=[],gUn=[],watching=null;const R={members:[],meetings:[],entries:[],expenses:[]};
const $=s=>document.querySelector(s),N=v=>+v||0,money=n=>Math.round(n||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{let e=$("#ts");if(!e){e=document.createElement("div");e.id="ts";document.body.appendChild(e)}e.textContent=m;e.className="show";clearTimeout(e.t);e.t=setTimeout(()=>e.className="",2400)};
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P=s=>{const[a,b,c]=s.split("-");return new Date(+a,b-1,+c)};
const AD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>P(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const G=()=>S.groups.find(g=>g.id===S.gid);
const cfg=()=>({loanMonthlyRate:10,loanMonths:3,loanPenalty:5000,loanFull:0,registrationFee:0,registrationFeeNew:0,retentionFee:0,meetFine:0,probationWeeks:3,starValue:2000,savMin:2000,savMax:20000,sfMin:1000,sfMax:10000,shareFines:1,openingSocial:0,cycleStart:"",absentFine:0,lateFine:0,noiseFine:0,loanFormFee:0,openingBalance:0,savChips:"2000,4000,6000,10000,20000",sfChips:"1000,2000,5000,10000",...(G()?.settings||{})});
const gcol=n=>collection(db,"groups",S.gid,n),gdoc=(n,id)=>doc(db,"groups",S.gid,n,id);
const mem=()=>[...S.members].sort((a,b)=>a.memberNo-b.memberNo);
const dates=()=>[...new Set([...S.meetings.map(m=>m.id),...S.entries.map(e=>e.date)])].sort();
const wk=d=>dates().indexOf(d)+1;
const fines=e=>N(e.absentFine)+N(e.lateFine)+N(e.noiseFine)+N(e.meetFine)+N(e.otherFines);
// Total Paid = cash the member hands in this week. Loan Taken is cash going out, so it is not included.
const cashSav=e=>N(e.savings)-N(e.prepaid)+N(e.advance); // cash actually received for savings (prepaid weeks bring no cash)
const cashSf=e=>N(e.socialFund)-N(e.sfPrepaid)+N(e.sfAdvance);
const evenOK=a=>Number.isInteger(a)&&a%2===0;
const chkSav=a=>{const c=cfg(),lo=N(c.savMin),hi=N(c.savMax);if(!evenOK(a)||a<lo||a>hi){toast("Weekly savings must be an even amount from "+money(lo)+" to "+money(hi));return false}return true};
const chkSf=a=>{const c=cfg(),lo=N(c.sfMin),hi=N(c.sfMax);if(!Number.isInteger(a)||a<lo||a>hi){toast("Social fund must be from "+money(lo)+" to "+money(hi));return false}return true};
const AM=(s,n)=>{const d=P(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};
const paid=e=>N(e.registration)+N(e.retention)+cashSav(e)+cashSf(e)+N(e.loanRepayment)+N(e.loanFormFee)+fines(e);
const mOf=id=>S.members.find(m=>m.id===id)||{name:"Unknown",memberNo:"?"};
const sumE=(es,k)=>es.reduce((a,e)=>a+N(e[k]),0);
// Everything the app shows is limited to the current saving cycle (cycle start date in Setup). Older records stay in the database.
const applyCycle=()=>{const cs=cfg().cycleStart||"",ok=d=>!cs||d>=cs;S.members=R.members;S.meetings=R.meetings.filter(m=>ok(m.id));S.entries=R.entries.filter(e=>ok(e.date));S.expenses=R.expenses.filter(x=>ok(x.date))};
async function bulk(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(([r,d])=>b.set(r,d,{merge:true}));await b.commit()}}
window.addEventListener("online",()=>toast("Back online"));
window.addEventListener("offline",()=>toast("Offline: saving on this phone"));

/* ---------- AUTH ---------- */
const emailOf=p=>p.replace(/\D/g,"")+"@savingsbook.app";
function stop(){unsubs.forEach(f=>f());unsubs=[];gUn.forEach(f=>f());gUn=[];watching=null}
function login(){
  stop();$("#nv").innerHTML="";$("#cb").hidden=true;$("#hn").textContent="VSLA Group Book";$("#ha").textContent="";
  $("#main").innerHTML=`<div class="box"><h2>Sign in</h2><label for="ph">Phone number</label><input id="ph" inputmode="tel" placeholder="0772123456"><label for="pin">6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6"><div id="cf" class="hide"><label for="pin2">Repeat PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="6"></div><button class="pri" id="in">Sign in</button><button class="pri" id="up" style="background:var(--leaf);color:#fff">Create account</button></div>`;
  const run=async fn=>{const ph=$("#ph").value,pin=$("#pin").value;
    if(ph.replace(/\D/g,"").length<9||!/^\d{6}$/.test(pin))return toast("Enter a valid phone number and a 6-digit PIN");
    try{await fn(auth,emailOf(ph),pin)}catch(e){toast(e.code==="auth/invalid-credential"?"Wrong phone number or PIN":e.code==="auth/email-already-in-use"?"Account exists. Sign in instead":"Could not sign in: "+e.code)}};
  $("#in").onclick=()=>run(signInWithEmailAndPassword);$("#up").onclick=()=>{if($("#cf").classList.contains("hide")){$("#cf").classList.remove("hide");return toast("Repeat your PIN, then tap Create account again")}if($("#pin").value!==$("#pin2").value)return toast("PINs do not match");run(createUserWithEmailAndPassword)};
}
onAuthStateChanged(auth,u=>{
  S.user=u;stop();if(!u)return login();
  unsubs.push(onSnapshot(query(collection(db,"groups"),where("ownerId","==",u.uid)),snap=>{
    S.groups=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.groups.find(g=>g.id===S.gid))S.gid=S.groups[0]?.id||null;
    if(!S.gid)return createGroup();
    applyCycle();watch();$("#body")?refresh():shell();
  }));
});
function createGroup(){
  $("#nv").innerHTML="";$("#cb").hidden=true;
  $("#main").innerHTML=`<div class="box"><h2>Create your group</h2><label for="gn">Group name</label><input id="gn" placeholder="e.g. OYBA Build Up"><button class="pri" id="mk">Create group</button><button class="lnk" id="out">Sign out</button></div>`;
  $("#mk").onclick=async()=>{const name=$("#gn").value.trim();if(!name)return toast("Enter a group name");
    await addDoc(collection(db,"groups"),{name,ownerId:S.user.uid,createdAt:serverTimestamp()})};
  $("#out").onclick=()=>signOut(auth);
}
function watch(){
  if(watching===S.gid)return;gUn.forEach(f=>f());gUn=[];watching=S.gid;
  [["members","members"],["meetings","meetings"],["entries","entries"],["expenses","expenses"]].forEach(([n,k])=>gUn.push(onSnapshot(gcol(n),s=>{R[k]=s.docs.map(d=>({id:d.id,...d.data()}));applyCycle();if(k==="members")fixIds();refresh()})));
}

// Members created by the first version have no ID number: number them once, in the order they were added.
function fixIds(){const miss=S.members.filter(m=>!m.memberNo);if(!miss.length)return;let n=S.members.reduce((a,m)=>Math.max(a,m.memberNo||0),0);
  miss.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).forEach(m=>updateDoc(gdoc("members",m.id),{memberNo:++n,status:m.status||"Active",gender:m.gender||"",village:m.village||"",contact:m.contact||m.phone||"",joinDate:m.joinDate||""}))}


/* ---------- TEMPLATE HELPERS (same look as the hardware app) ---------- */
const V={};
const TABS=[["home","Home"],["meeting","Saving week"],["members","Members"],["money","Money"],["rep","Reports"],["set","Setup"]];
const card=(l,v,o={})=>`<div class="stat${o.w?" wide":""}"${o.g?` role="button" tabindex="0" data-act="go" data-arg="${o.g}"`:""}><small>${l}</small><span class="num ${o.c||""}">${v}</span></div>`;
const item=(t,s,r,a,cls="")=>{const tg=a?"button":"div";return `<${tg} class="item"${a?` data-act="${a[0]}" data-arg="${esc(a[1])}"`:' style="cursor:default"'}><span class="nm"><b>${t}</b><small>${s||""}</small></span><span class="pr ${cls}">${r??""}</span></${tg}>`};
const seg=(arr,cur,act)=>`<div class="seg">${arr.map(([k,l])=>`<button class="${cur===k?"on":""}" data-act="${act}" data-arg="${k}">${l}</button>`).join("")}</div>`;
const empty=t=>`<div class="empty">${t}</div>`;

const inp=(id,l,t="text",v="",x="")=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==="number"?'inputmode="numeric" min="0"':""} value="${esc(v)}" ${x}>`;

// One tap on a member applies the chosen action. Tapping again with the same action undoes it.
function apply(mid){
  const b=S.brush,id=S.date+"_"+mid,{id:_x,...e}=S.entries.find(x=>x.id===id)||{date:S.date,memberId:mid};
  let v=b.v;
  if(b.k==="savings"&&N(e.prepaid)>0)return toast("This week is already prepaid");
  if(v==="ADV"){if(N(e.advance)>0){e.savings=0;e.advance=0;e.advanceWeeks=0;e.advanceWeekly=0}else{const w=N(prompt("Weekly savings amount (even, 2,000 to 20,000)")),n=Math.round(N(prompt("Weeks paid, including this week (2 or more)")));if(!chkSav(w))return;if(n<2||n>52)return toast("Weeks must be from 2 to 52");e.savings=w;e.advance=w*(n-1);e.advanceWeeks=n-1;e.advanceWeekly=w}}
  else{
    if(v==="?"){const x=prompt(b.l.replace(/:.*/,"")+" amount");if(x===null)return;v=N(x)}
    if(e[b.k]===v)v=b.k==="attendance"?"":0;
    if(v&&b.k==="savings"&&!chkSav(v))return;if(v&&b.k==="socialFund"&&!chkSf(v))return;
    e[b.k]=v;if(b.k==="savings"&&!v){e.advance=0;e.advanceWeeks=0;e.advanceWeekly=0}}
  if(b.k==="attendance"){const c=cfg();e.absentFine=v==="Absent"?N(c.absentFine):0;e.lateFine=v==="Late"?N(c.lateFine):0}
  e.totalFines=fines(e);e.totalPaid=paid(e);
  setDoc(gdoc("entries",id),e).catch(x=>toast("Could not save: "+x.code));
}

async function moveMeeting(a,b){
  if(dates().includes(b))return toast("A meeting already exists on that date");
  const bt=writeBatch(db);
  S.entries.filter(e=>e.date===a).forEach(({id,...e})=>{bt.set(gdoc("entries",b+"_"+e.memberId),{...e,date:b});bt.delete(gdoc("entries",id))});
  S.expenses.filter(x=>x.date===a).forEach(x=>bt.update(gdoc("expenses",x.id),{date:b}));
  bt.set(gdoc("meetings",b),{date:b});bt.delete(gdoc("meetings",a));
  await bt.commit();S.date=b;toast("Meeting moved to "+fmt(b));
}

function cash(d){
  const es=S.entries.filter(e=>e.date===d),ex=S.expenses.filter(x=>x.date===d);
  const r={reg:sumE(es,"registration"),ret:sumE(es,"retention"),sav:sumA(es,e=>N(e.savings)-N(e.prepaid)),adv:sumE(es,"advance"),pre:sumE(es,"prepaid"),sf:sumA(es,cashSf),fee:sumE(es,"loanFormFee"),fin:es.reduce((a,e)=>a+fines(e),0),rep:sumE(es,"loanRepayment"),loan:sumE(es,"loanTaken"),exs:ex,exp:ex.reduce((a,x)=>a+N(x.amount),0),expSoc:ex.filter(x=>x.fund==="Social fund").reduce((a,x)=>a+N(x.amount),0)};
  r.in=r.reg+r.ret+r.sav+r.adv+r.sf+r.fee+r.fin+r.rep;r.net=r.in-r.loan-r.exp;return r;
}
function book(){let bal=N(cfg().openingBalance),soc=N(cfg().openingSocial);return dates().map(d=>{const r=cash(d);r.d=d;r.open=bal;r.avail=bal+r.in;bal+=r.net;soc+=r.sf-r.expSoc;r.close=bal;r.socClose=soc;return r})}

};

  const H=[["Run a Sunday (or Saturday) meeting","<ol><li>Home, tap the big button, or use Meeting &gt; Calendar and tap the date.</li><li>On Roll call, tap <b>Change</b> and choose an action: Present, Late, Absent, a savings amount, a social fund amount or a fine.</li><li>Tap each member's name to apply it. Tap again to undo.</li><li>Use <b>⋯</b> on a member for loans, loan form fees and other details.</li></ol>"],["Money in the box","<p>Meeting &gt; Cash shows money in, loans given, expenses and what is left in the box. Add expenses such as printing loan forms, pens and rulers there. Money &gt; Cash book lists every meeting.</p>"],["Loans","<p>Give a loan with ⋯ on the member (Loan taken). Money &gt; Loans shows what is owed. Tap an unpaid loan to record a repayment.</p>"],["Weekly entry sheet","<p>Saving week &gt; Week sheet lists every member. Type savings, social fund and loan refund in each row and press Enter to jump to the next member. It saves automatically. Tap Fines for fixed fines. New members have a probation period with no savings.</p>"],["Reports and share-out","<p>Reports has a report for one meeting, a monthly report and the end-of-cycle share-out. Each can be downloaded as a spreadsheet.</p>"],["Paying savings ahead","<p>On a member's ⋯ enter the total handed in and the weeks covered (for example 100,000 for 5 weeks). The extra weeks show in yellow and are applied automatically when those meetings are opened. Savings must be even amounts from 2,000 to 20,000 a week; social fund from 1,000 to 10,000.</p>"],["Loans","<p>Interest is 10% for every month started, up to 3 months (30%). A loan not cleared after 3 months adds the penalty. Amounts are set in Setup.</p>"],["Install on your phone","<p>In Chrome, open the menu and tap Install app or Add to Home screen. The calculator button (🧮) also has a loan calculator and a cash counter.</p>"]];
  body(`<button class="btn" data-act="go" data-arg="set" style="margin:0 0 8px">← Back to Setup</button><h2>How to use this app</h2>`+H.map(([t,h])=>`<details><summary>${t}</summary>${h}</details>`).join(""));
};
function loanCalc(){
  const c=cfg();modal(`<h2>Loan calculator</h2>${inp("lc_a","Loan amount","number")}${inp("lc_r","Interest per month (%)","number",c.loanMonthlyRate)}${inp("lc_w","Months to repay","number",c.loanMonths)}<div class="stat wide" id="lcr"></div><button class="btn" id="lx">Close</button>`);
  const f=()=>{const a=N($("#lc_a").value),r=N($("#lc_r").value),w=N($("#lc_w").value),i=a*r/100*w;$("#lcr").innerHTML=a?`<small>Interest ${money(i)} (${r*w}%) · penalty if late ${money(c.loanPenalty)} · per month ${w?money((a+i)/w):"-"}</small><span class="num">UGX ${money(a+i)}</span>`:"<small>Enter an amount</small>"};
  ["lc_a","lc_r","lc_w"].forEach(i=>$("#"+i).oninput=f);f();$("#lx").onclick=()=>modal();
}
function cashCount(){
  const notes=[50000,20000,10000,5000,2000,1000,500,200,100];
  modal(`<h2>Cash counter</h2>${notes.map(n=>`<div class="row"><label style="margin:0">${money(n)} ×</label><input data-n="${n}" type="number" inputmode="numeric" min="0" style="width:90px;margin:0" aria-label="${money(n)} notes"></div>`).join("")}<div class="stat wide" style="margin-top:8px"><small>Total cash</small><span class="num" id="cct">0</span></div><button class="btn" id="cx2">Close</button>`);
  document.querySelectorAll("#md [data-n]").forEach(i=>i.oninput=()=>$("#cct").textContent=money(sumA([...document.querySelectorAll("#md [data-n]")],x=>N(x.value)*x.dataset.n)));
  $("#cx2").onclick=()=>modal();
}
Object.assign(window,{modal,kp,calc});

$("#installApp").onclick=async()=>{if(dip){dip.prompt();await dip.userChoice;dip=null;$("#installApp").style.display="none"}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
